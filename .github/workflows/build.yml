name: 'build-windows'

# Cach chay: vao tab Actions tren GitHub, chon workflow "build-windows",
# bam "Run workflow" (nhanh main) -- hoac push code len nhanh "release".
on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build-windows:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'T&T Tu Vi Dau So App v__VERSION__'
          releaseBody: 'Ban cai dat Windows (.exe) -- tai file "*-setup.exe" ben duoi de cai.'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
